<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>hmziq studio</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('studio-theme') || document.documentElement.dataset.theme || 'dark';
					document.documentElement.classList.toggle('dark', t !== 'light');
					var d = document.documentElement.dataset;
					var o = localStorage.getItem('studio-light') || 'e';
					if (o === 'e') d.light = 'e';
					d.oxide = o === 'e' ? 'b' : o;
					var s = localStorage.getItem('studio-sans');
					if (s && s !== 'onest') d.sans = s;
					var f = localStorage.getItem('studio-serif');
					if (f && f !== 'page') d.serif = f;
					var h = localStorage.getItem('studio-hue');
					if (h && h !== 'oxide') d.hue = h;
				} catch (e) {
					document.documentElement.classList.add('dark');
					document.documentElement.dataset.light = 'e';
					document.documentElement.dataset.oxide = 'b';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
