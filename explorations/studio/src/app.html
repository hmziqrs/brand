<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>hmziq studio</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('studio-theme') || document.documentElement.dataset.theme || 'dark';
					document.documentElement.classList.toggle('dark', t !== 'light');
					var o = localStorage.getItem('studio-oxide');
					if (o) document.documentElement.dataset.oxide = o;
				} catch (e) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
