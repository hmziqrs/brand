# The age gate: a newly published version waits a day before a fresh install may
# take it. The listed packages (the exclusions carried over from the old config,
# by name) install as soon as they are published.
[install]
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = [
  "@vitest/mocker",
  "@vitest/spy",
  "vitest",
  "@lucide/svelte",
  "remotion",
  "@remotion/bundler",
  "@remotion/canvas",
  "@remotion/captions",
  "@remotion/cli",
  "@remotion/codemods",
  "@remotion/compositor-darwin-arm64",
  "@remotion/compositor-darwin-x64",
  "@remotion/compositor-linux-arm64-gnu",
  "@remotion/compositor-linux-arm64-musl",
  "@remotion/compositor-linux-x64-gnu",
  "@remotion/compositor-linux-x64-musl",
  "@remotion/compositor-win32-x64-msvc",
  "@remotion/elevenlabs",
  "@remotion/licensing",
  "@remotion/media-parser",
  "@remotion/media-utils",
  "@remotion/media",
  "@remotion/openai-whisper",
  "@remotion/paths",
  "@remotion/player",
  "@remotion/renderer",
  "@remotion/streaming",
  "@remotion/studio-protocol",
  "@remotion/studio-server",
  "@remotion/studio-shared",
  "@remotion/studio",
  "@remotion/timeline-utils",
  "@remotion/web-renderer",
  "@remotion/zod-types",
]
