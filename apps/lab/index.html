<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The hmziq icon pack, synced into public/ by pnpm render-assets
         (assets.md); the same tags the pack's head.html holds. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <!-- The hmziq link preview (assets.md): the lab is one page with hash
         routes, so only the hmziq identity is wired, here in its head. The
         cards are the social exports for hmziq, synced into public/ by
         pnpm render-assets; the description is the site's approved headline,
         the same words the card carries. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hmziq" />
    <meta property="og:title" content="hmziq brand" />
    <meta property="og:description" content="I build apps for phones, computers, the web and the terminal." />
    <meta property="og:image" content="og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The hmziq mark and headline on the brand's dark background." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="hmziq brand" />
    <meta name="twitter:description" content="I build apps for phones, computers, the web and the terminal." />
    <meta name="twitter:image" content="x-1200x675.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hmziq brand</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
